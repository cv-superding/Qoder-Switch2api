name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.1.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Build Windows binaries
        shell: pwsh
        working-directory: src-tauri
        run: cargo build --release --bins

      - name: Verify binaries
        shell: pwsh
        run: |
          Get-Item src-tauri/target/release/qoder-switch2api.exe, src-tauri/target/release/qoder-server.exe |
            Format-Table Name, Length

      - name: Build NSIS installer
        shell: pwsh
        run: npm run desktop:installer

      - name: Verify installer
        shell: pwsh
        run: |
          Get-Item src-tauri/target/release/bundle/nsis/*.exe |
            Format-Table Name, Length

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Qoder-Switch2api ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body: |
            ## Qoder-Switch2api ${{ env.RELEASE_TAG }}

            国内版 Qoder CN / 国际版 Qoder 双版本账号池、每日自动签到、额度统计与 OpenAI / Anthropic 兼容反代。

            ### 下载

            - `Qoder-Switch2api_<version>_x64-setup.exe`：**推荐安装版**，按用户安装、无需管理员权限，自动创建开始菜单快捷方式并带卸载程序
            - `qoder-switch2api.exe`：便携桌面版，不写入安装目录
            - `qoder-server.exe`：仅启动本地服务，浏览器访问 `http://127.0.0.1:8787`

            安装版与便携版共用 `~/.qoder-switch/` 数据目录，卸载不会删除账号和配置。
            可执行文件未签名，首次运行如遇 SmartScreen 提示请选择「更多信息 → 仍要运行」。

            完整更新日志见仓库 README 的「更新日志」。

            > 账号凭证等同密码。数据保存在 `~/.qoder-switch/`，本项目不会上传任何账号数据。
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/qoder-switch2api.exe
            src-tauri/target/release/qoder-server.exe
